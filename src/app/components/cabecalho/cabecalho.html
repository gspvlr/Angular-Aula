<header class="cabecalho">
  <a
    class="marca"
    href="#inicio"
    aria-label="Início"
  >
    <img class="marca-icone" src="/assets/icone-header.png" alt="Mascote Café & Código" />
    <div class="marca-info">
      <span>Café <em>&amp;</em> Código</span>
      <small class="marca-autor">by Souza Dev</small>
    </div>
  </a>

  <button
    class="botao-menu"
    type="button"
    [class.ativo]="menuAberto()"
    [attr.aria-expanded]="menuAberto()"
    [attr.aria-label]="menuAberto() ? 'Fechar menu de navegação' : 'Abrir menu de navegação'"
    (click)="alternarMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav
    class="navegacao"
    [class.aberta]="menuAberto()"
    aria-label="Navegação principal"
  >
    <a href="#inicio" (click)="fecharMenu()">Início</a>
    <a href="#sobre" (click)="fecharMenu()">Sobre nós</a>
    <a href="#servicos" (click)="fecharMenu()">Serviços</a>
    <a href="#contato" (click)="fecharMenu()">Contato</a>

    <a
      class="acao"
      href="#cadastro"
      (click)="fecharMenu()"
    >
      Cadastre-se
      <span>→</span>
    </a>

    <button
      class="botao-tema"
      type="button"
      [attr.aria-label]="isDarkMode() ? 'Ativar modo claro' : 'Ativar modo escuro'"
      [title]="isDarkMode() ? 'Modo Claro' : 'Modo Escuro'"
      (click)="alternarTema()"
    >
      @if (isDarkMode()) {
        <svg class="icone-tema" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2"/>
          <path d="M12 20v2"/>
          <path d="m4.93 4.93 1.41 1.41"/>
          <path d="m17.66 17.66 1.41 1.41"/>
          <path d="M2 12h2"/>
          <path d="M20 12h2"/>
          <path d="m6.34 17.66-1.41 1.41"/>
          <path d="m19.07 4.93-1.41 1.41"/>
        </svg>
      } @else {
        <svg class="icone-tema" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      }
    </button>
  </nav>
</header>
